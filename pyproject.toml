[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-data-analyst-agent"
version = "0.2.0"
description = "Reliable analytical foundation and API for an AI data analyst agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0,<2.0", "numpy>=1.26,<3.0", "polars>=1.0,<2.0", "scipy>=1.12,<2.0",
  "fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "python-multipart>=0.0.9",
  "sqlalchemy>=2.0,<3.0", "alembic>=1.13,<2.0", "psycopg[binary]>=3.2,<4.0",
  "PyJWT>=2.9,<3.0", "pwdlib[argon2]>=0.2,<1.0", "groq>=0.11,<2.0", "google-genai>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]
llm = ["openai>=1.0,<2.0"]

[project.scripts]
data-analyst = "data_analyst.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/data_analyst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
