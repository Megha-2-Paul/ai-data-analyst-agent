[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-data-analyst-agent"
version = "0.1.0"
description = "Reliable analytical foundation for an AI data analyst agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0,<2.0",
  "numpy>=1.26,<3.0",
  "polars>=1.0,<2.0",
  "scipy>=1.12,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]
llm = ["openai>=1.0,<2.0"]

[project.scripts]
data-analyst = "data_analyst.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/data_analyst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
