services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_data_analyst
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_data_analyst"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-local-development-only}@db:5432/ai_data_analyst
      DATA_STORAGE_DIR: /app/data/uploads
    ports:
      - "8000:8000"
    volumes:
      - uploaded_data:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploaded_data:
