name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"

      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: docker build -t ai-data-analyst-agent:ci .
      - name: Validate frontend JavaScript syntax
        run: node --check frontend/app.js

      - name: Build frontend Docker image
        run: docker build -f frontend/Dockerfile -t ai-data-analyst-frontend:ci .

      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
