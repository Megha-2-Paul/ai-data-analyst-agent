name: Optional provider smoke tests

on:
  workflow_dispatch:
  push:
    branches:
      - stage-4-data-preparation
    paths:
      - ".github/workflows/provider-smoke.yml"
      - "src/data_analyst/providers.py"
      - "tests/test_live_providers.py"
      - "pyproject.toml"

jobs:
  provider-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Require at least one provider key
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ] && [ -z "$GEMINI_API_KEY" ]; then
            echo "Configure GROQ_API_KEY or GEMINI_API_KEY in repository Actions secrets before running live smoke tests."
            exit 1
          fi
      - name: Run configured provider smoke tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: pytest -q -rs tests/test_live_providers.py
